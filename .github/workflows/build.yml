name: Build image

# Every push to master: run the checks, build the production image and push it to GitHub's registry
# (ghcr.io). Deploying is manual: run deploy.sh in vps-infrastructure/projects/trend-pool on the VPS.
on:
  push:
    branches: ["master"]
  workflow_dispatch: # "Run workflow" button, e.g. to rebuild without a new commit

env:
  REGISTRY: ghcr.io
  # One image for every role (web, worker, migrate); compose.yaml / the VPS compose pick the command.
  IMAGE_NAME: mrtilki09/trend-pool

# A newer push cancels a still-running build of an older one.
concurrency:
  group: build-master
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          # :latest is what the VPS runs; :sha-xxxxxxx keeps every build for rollbacks.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No automatic deploy: on the VPS run vps-infrastructure/projects/trend-pool/deploy.sh by hand
      # to pull this image and restart.
